@if (faqSection) {
  <div class="faq-container">
    <div class="section">
      <h2>{{'FAQ.title' | translate}}</h2>
      @for (faq of faqSection; track faq) {
        <nz-collapse nzGhost [nzBordered]="false" [nzExpandIconPosition]="'end'">
          <nz-collapse-panel [nzHeader]="faq.Frage" >
            <div [innerHTML]="faq.Antwort"></div>
          </nz-collapse-panel>
        </nz-collapse>
      }
    </div>
  </div>
}
