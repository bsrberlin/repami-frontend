<div class="register-outer-container">
  <form nzNoColon="true" nz-form id="register-form" [formGroup]="loginForm" (ngSubmit)="submitForm()">
    <div class="outer-container">
      <h1>Anmelden</h1>
      <p>Hier kannst du dich als Reparaturbetrieb einloggen.
        Du hast noch kein Nutzerkonto? <a routerLink="/register">Jetzt registrieren</a></p>
        <div class="input-container">
          <nz-form-item>
            <nz-form-label class="label" nzFor="email">{{ 'login.email' | translate }}</nz-form-label>
            <nz-form-control nzErrorTip="{{ 'login.emailInvalid' | translate }}">
              <input nz-input formControlName="email" id="email" />
            </nz-form-control>
          </nz-form-item>
          <nz-form-item>
            <nz-form-label class="label" nzFor="password">{{ 'login.password' | translate }}</nz-form-label>
            <nz-form-control>
              <input
                nz-input
                type="password"
                id="password"
                formControlName="password"
                />
            </nz-form-control>
          </nz-form-item>
          <nz-form-item nz-row>
            <div></div>
            <nz-form-control >
              <button nz-button class="button" nzType="primary">{{ 'login.loginButton' | translate }}<span class="icon-container" nz-icon nzType="right" nzTheme="outline"></span></button>
            </nz-form-control>
          </nz-form-item>
        </div>
      </div>
    </form>
  </div>
  @if (participateSection) {
    <participate-section [participateSection]="participateSection"></participate-section>
  }
